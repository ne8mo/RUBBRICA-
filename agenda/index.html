<title>Agenda a Tre</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: sidebar (mini-calendario, persone) + area principale con griglia oraria a giorno/settimana; rubrica come seconda scheda. */
:root{
  --bg:#F4F5F8; --surface:#FFFFFF; --surface-2:#ECEEF3; --fg:#141922; --muted:#5C6577; --line:#E0E3EA;
  --accent:#3346D3; --accent-fg:#FFFFFF; --danger:#C8352B; --ok:#1C8A5A; --wa:#1DA851;
  --shadow:0 1px 2px rgba(20,25,34,.06),0 8px 24px rgba(20,25,34,.08);
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
  --hour:58px; --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1117; --surface:#161A22; --surface-2:#1E232D; --fg:#E7EAF0; --muted:#97A0B2; --line:#282E3A;
  --accent:#8E9CFF; --accent-fg:#0E1117; --danger:#FF7B6E; --ok:#4FD39A; --wa:#3DDC7A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1117; --surface:#161A22; --surface-2:#1E232D; --fg:#E7EAF0; --muted:#97A0B2; --line:#282E3A;
  --accent:#8E9CFF; --accent-fg:#0E1117; --danger:#FF7B6E; --ok:#4FD39A; --wa:#3DDC7A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.45;padding-inline:16px;padding-block:16px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
.muted{color:var(--muted)}
.tnum{font-variant-numeric:tabular-nums}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}

.app{max-width:1320px;margin:0 auto;display:grid;gap:16px}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brand h1{font-size:26px;font-weight:700}
.brand .dots{display:inline-flex;gap:4px;transform:translateY(-3px)}
.brand .dots i{width:9px;height:9px;border-radius:50%;background:var(--c,var(--line))}
.tabs{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:3px}
.tabs button{border:0;background:none;padding:7px 16px;border-radius:999px;font-weight:600;color:var(--muted)}
.tabs button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.me{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px 4px 4px;font-weight:600}
.av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:#fff;font-size:12px;font-weight:700;flex:none}
.av.lg{width:42px;height:42px;font-size:15px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;font-weight:600;text-decoration:none;color:var(--fg);white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn.primary:hover{opacity:.9}
.btn.ghost{border-color:transparent;background:none}
.btn.danger{color:var(--danger)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn.icon{padding:7px 10px}
.btn.wa{color:var(--wa)}
.btn svg{width:16px;height:16px;flex:none}

.banner{border:1px dashed var(--line);border-radius:var(--r);padding:10px 14px;color:var(--muted);background:var(--surface)}

.layout{display:grid;grid-template-columns:272px minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.layout{grid-template-columns:minmax(0,1fr)}.layout .side{order:2}}
[hidden]{display:none!important}
.side{display:grid;gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}

/* mini calendario */
.mc-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.mc-head h3{font-size:16px;text-transform:capitalize}
.mc{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.mc .dow{font-size:11px;color:var(--muted);font-weight:600;padding:4px 0}
.mc button{border:0;background:none;border-radius:8px;padding:5px 0 7px;position:relative;font-variant-numeric:tabular-nums;font-size:13px}
.mc button:hover{background:var(--surface-2)}
.mc button.out{color:var(--muted);opacity:.5}
.mc button.today{color:var(--accent);font-weight:700}
.mc button.sel{background:var(--fg);color:var(--bg)}
.mc .pips{position:absolute;left:0;right:0;bottom:2px;display:flex;justify-content:center;gap:2px}
.mc .pips i{width:4px;height:4px;border-radius:50%;background:var(--c)}

.people{display:grid;gap:6px;margin-top:10px}
.person{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:10px;border:0;background:none;text-align:left;width:100%}
.person:hover{background:var(--surface-2)}
.person .nm{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.person .cnt{font-size:12px;color:var(--muted)}
.person.off{opacity:.45}
.person.off .av{background:var(--surface-2);color:var(--muted)}
.person.empty .nm{color:var(--muted);font-weight:500}

.up{display:grid;gap:8px;margin-top:10px}
.up-item{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;border:0;background:none;text-align:left;padding:6px;border-radius:10px;width:100%}
.up-item:hover{background:var(--surface-2)}
.up-item .bar{width:4px;align-self:stretch;border-radius:4px;background:var(--c)}
.up-item b{display:block;font-weight:600}
.up-item small{color:var(--muted)}

/* barra calendario */
.calbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:12px}
.calbar h2{font-size:22px;margin-right:auto;text-transform:capitalize;min-width:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:7px 12px;font-weight:600;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}

.cal{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.cal-scroll{overflow-x:auto}
.grid{display:grid;grid-template-columns:56px repeat(var(--days),minmax(var(--colmin),1fr));min-width:calc(56px + var(--days) * var(--colmin))}
.gh{position:sticky;top:0;background:var(--surface);z-index:3;border-bottom:1px solid var(--line);padding:10px 8px;text-align:center}
.gh button{border:0;background:none;display:grid;gap:2px;justify-items:center;margin:0 auto;padding:2px 8px;border-radius:10px}
.gh button:hover{background:var(--surface-2)}
.gh .d{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.gh .n{font-family:var(--f-display);font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.gh.today .n{color:var(--accent)}
.times{position:relative}
.times span{position:absolute;right:8px;transform:translateY(-50%);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.col{position:relative;border-left:1px solid var(--line);background:
  repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--hour) - 1px),var(--line) calc(var(--hour) - 1px),var(--line) var(--hour));cursor:copy}
.col.today{background-color:color-mix(in srgb,var(--accent) 4%,transparent)}
.col .half{position:absolute;left:0;right:0;border-top:1px dashed color-mix(in srgb,var(--line) 70%,transparent);pointer-events:none}
.ev{position:absolute;border-radius:9px;padding:4px 7px;overflow:hidden;cursor:pointer;border:1px solid color-mix(in srgb,var(--c) 45%,transparent);
  background:color-mix(in srgb,var(--c) 15%,var(--surface));color:var(--fg);text-align:left;font-size:12px;line-height:1.3;display:flex;flex-direction:column;gap:1px;z-index:1}
.ev:hover{background:color-mix(in srgb,var(--c) 24%,var(--surface));z-index:2}
.ev .t{font-weight:700;display:flex;align-items:center;gap:5px;min-width:0}
.ev .t i{width:7px;height:7px;border-radius:50%;background:var(--c);flex:none}
.ev .t span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev .s{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev .who{color:color-mix(in srgb,var(--c) 70%,var(--fg));font-weight:600}
.now{position:absolute;left:0;right:0;height:2px;background:var(--danger);z-index:2;pointer-events:none}
.now::before{content:"";position:absolute;left:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--danger)}
.cal-empty{padding:10px 16px;border-top:1px solid var(--line);color:var(--muted);font-size:13px}

/* rubrica */
.rb-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.rb-bar h2{font-size:22px;margin-right:auto}
.search{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;min-width:0;width:260px;max-width:100%}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:12px;min-width:0}
.card-h{display:flex;gap:12px;align-items:center;min-width:0}
.card-h .av{background:var(--surface-2);color:var(--fg)}
.card-h h3{font-size:17px;overflow:hidden;text-overflow:ellipsis}
.kv{display:grid;gap:6px}
.kv div{display:flex;align-items:center;gap:8px;min-width:0}
.kv .v{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;user-select:all}
.kv .k{width:58px;flex:none}
.actions{display:flex;flex-wrap:wrap;gap:6px}
.next{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center}
.next i{width:7px;height:7px;border-radius:50%;background:var(--c)}
.empty-state{background:var(--surface);border:1px dashed var(--line);border-radius:16px;padding:32px 20px;text-align:center;display:grid;gap:10px;justify-items:center}
.empty-state h3{font-size:18px}

/* modale */
.overlay{position:fixed;inset:0;background:color-mix(in srgb,#05070b 45%,transparent);display:grid;place-items:center;padding:16px;z-index:50;overflow-y:auto}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);width:min(520px,100%);padding:20px;display:grid;gap:14px;max-height:calc(100% - 8px);overflow-y:auto}
.modal h2{font-size:21px}
.mh{display:flex;align-items:center;gap:10px}
.mh h2{flex:1}
.fields{display:grid;gap:12px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.f{display:grid;gap:5px;min-width:0}
.f input,.f select,.f textarea{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 11px;width:100%;min-width:0}
.f textarea{resize:vertical;min-height:64px}
.f input:focus,.f select:focus,.f textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.picks{display:flex;flex-wrap:wrap;gap:6px}
.pick{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px 4px 4px;font-weight:600}
.pick .av{width:24px;height:24px;font-size:11px}
.pick[aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,var(--surface))}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:32px;height:32px;border-radius:50%;border:3px solid var(--surface);background:var(--c);box-shadow:0 0 0 1px var(--line)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--fg)}
.sw:disabled{opacity:.2;cursor:not-allowed}
.sub{border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:10px;background:var(--surface-2)}
.sub .f input{background:var(--surface)}
.contact-strip{display:flex;flex-wrap:wrap;align-items:center;gap:8px;border-radius:12px;padding:10px 12px;background:var(--surface-2)}
.contact-strip .who{flex:1;min-width:140px}
.contact-strip .who small{display:block;color:var(--muted);user-select:all;overflow-wrap:anywhere}
.foot{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.foot .sp{flex:1}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;color:var(--danger);font-weight:600}
.err{color:var(--danger);font-size:13px;font-weight:600}

/* onboarding */
.slots{display:grid;gap:8px}
.slot{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--surface);text-align:left;width:100%}
.slot[aria-pressed="true"]{border-color:var(--fg);box-shadow:0 0 0 1px var(--fg)}
.slot:disabled{opacity:.55;cursor:not-allowed}
.slot .nm{flex:1;font-weight:600}
.slot .st{font-size:12px;color:var(--muted)}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.ev,.btn,.person{transition:background-color .15s}.modal{animation:pop .16s ease-out}@keyframes pop{from{transform:translateY(6px);opacity:.6}}}
</style>

<div class="app" id="app">
  <header class="top">
    <div class="brand"><h1>Agenda a Tre</h1><span class="dots" id="brandDots"><i></i><i></i><i></i></span></div>
    <div class="tabs" role="group" aria-label="Sezione">
      <button id="tabAgenda" aria-pressed="true">Agenda</button>
      <button id="tabRubrica" aria-pressed="false">Rubrica</button>
    </div>
    <button class="me" id="meChip" title="Modifica il tuo profilo"><span class="av" style="--c:var(--line)">?</span><span>Accedi</span></button>
  </header>
  <div class="banner" id="banner" hidden></div>

  <section id="viewAgenda" class="layout">
    <aside class="side">
      <div class="panel">
        <div class="mc-head">
          <button class="btn ghost icon sm" id="mcPrev" aria-label="Mese precedente"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></button>
          <h3 id="mcTitle">Mese</h3>
          <button class="btn ghost icon sm" id="mcNext" aria-label="Mese successivo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg></button>
        </div>
        <div class="mc" id="mc"></div>
      </div>
      <div class="panel">
        <div class="label">Persone · tocca per mostrare o nascondere</div>
        <div class="people" id="people"></div>
      </div>
      <div class="panel">
        <div class="label">Prossimi appuntamenti</div>
        <div class="up" id="upcoming"></div>
      </div>
    </aside>

    <div style="min-width:0">
      <div class="calbar">
        <h2 id="calTitle">Oggi</h2>
        <div class="seg" role="group" aria-label="Vista">
          <button id="vDay" aria-pressed="true">Giorno</button>
          <button id="vWeek" aria-pressed="false">Settimana</button>
        </div>
        <div class="seg">
          <button id="prev" aria-label="Precedente">‹</button>
          <button id="today">Oggi</button>
          <button id="next" aria-label="Successivo">›</button>
        </div>
        <button class="btn primary" id="newAppt"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg>Appuntamento</button>
      </div>
      <div class="cal">
        <div class="cal-scroll" id="calScroll"><div class="grid" id="grid"></div></div>
        <div class="cal-empty" id="calHint">Tocca un orario libero per fissare un appuntamento.</div>
      </div>
    </div>
  </section>

  <section id="viewRubrica" hidden>
    <div class="rb-bar">
      <h2>Rubrica</h2>
      <input class="search" id="rbSearch" type="search" placeholder="Cerca per nome, email o telefono">
      <button class="btn primary" id="newContact"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg>Contatto</button>
    </div>
    <div class="cards" id="cards"></div>
  </section>
</div>
<div id="layer"></div>

<script>
(() => {
  /* ---------- costanti e utilità ---------- */
  const START_H = 7, END_H = 22;
  const SLOTS = ["p1","p2","p3"];
  const PALETTE = ["#E4572E","#17A398","#7A5AF8","#E9A800","#D63F8C","#2D8CE6","#5EA33A","#8B6E4E"];
  const MESI = ["gennaio","febbraio","marzo","aprile","maggio","giugno","luglio","agosto","settembre","ottobre","novembre","dicembre"];
  const GIORNI = ["lun","mar","mer","gio","ven","sab","dom"];
  const GIORNI_LUNGHI = ["domenica","lunedì","martedì","mercoledì","giovedì","venerdì","sabato"];
  const ICON = {
    mail:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>',
    wa:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 00-8.6 15.1L2 22l5-1.3A10 10 0 1012 2zm0 18.2a8.2 8.2 0 01-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1112 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 01-3.3-2.9c-.3-.4.3-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 00-.7.3 3 3 0 00-.9 2.2 5.2 5.2 0 001.1 2.7 11.8 11.8 0 004.5 4c1.7.7 2.3.8 3.2.6a2.7 2.7 0 001.8-1.2 2.2 2.2 0 00.1-1.2c0-.1-.2-.2-.4-.3z"/></svg>',
    copy:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 012-2h10"/></svg>',
    cal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
    edit:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20h4L19 9l-4-4L4 16v4z"/></svg>',
    x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>'
  };
  const $ = id => document.getElementById(id);
  function el(tag, attrs, ...kids) {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v == null || v === false) continue;
      if (k === "class") n.className = v;
      else if (k === "style") n.style.cssText = v;
      else if (k === "html") n.innerHTML = v;
      else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v === true ? "" : v);
    }
    for (const c of kids.flat()) if (c != null && c !== false) n.append(c instanceof Node ? c : document.createTextNode(String(c)));
    return n;
  }
  const pad = n => String(n).padStart(2, "0");
  const iso = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  const parseIso = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
  const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
  const monday = d => addDays(d, -((d.getDay() + 6) % 7));
  const toMin = t => { const [h, m] = (t || "0:0").split(":").map(Number); return h * 60 + m; };
  const fromMin = m => pad(Math.floor(m / 60)) + ":" + pad(m % 60);
  const initials = s => (s || "?").trim().split(/\s+/).slice(0, 2).map(w => w[0]).join("").toUpperCase() || "?";
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  const ls = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
  function waNumber(phone) {
    let d = String(phone || "").replace(/[^\d+]/g, "");

      box.append(el("div", { class: "mh" }, el("h2", {}, isNew ? "Nuovo appuntamento" : "Appuntamento"), el("button", { class: "btn ghost icon", "aria-label": "Chiudi", html: ICON.x, onclick: close })),
        !isNew && el("div", { class: "muted", style: "font-size:13px;margin-top:-8px" }, "Ultima modifica di " + nameOf(a.updatedBy || a.createdBy)), form);
    });
  }

  function openContact(c) {
    const isNew = !c; c = c || { nome: "", cognome: "", email: "", telefono: "", note: "" };
    modal((box, close) => {
      const f = { nome: el("input", { id: "ctNome", value: c.nome || "", placeholder: "Mario" }), cognome: el("input", { id: "ctCognome", value: c.cognome || "", placeholder: "Rossi" }),
        email: el("input", { id: "ctEmail", type: "email", value: c.email || "", placeholder: "mario@esempio.it" }), telefono: el("input", { id: "ctTel", type: "tel", value: c.telefono || "", placeholder: "+39 333 123 4567" }),
        note: el("textarea", { id: "ctNote", placeholder: "Es. preferisce essere contattato la mattina" }, c.note || "") };

      const foot = el("div", { class: "foot" });
      const drawFoot = conf => {
        foot.replaceChildren();
        if (conf) { foot.append(el("div", { class: "confirm" }, "Eliminare il contatto?", el("button", { type: "button", class: "btn sm danger", onclick: async () => { if (await save(() => store.del("contacts", c.id), "Contatto eliminato")) close(); } }, "Sì, elimina"), el("button", { type: "button", class: "btn sm", onclick: () => drawFoot(false) }, "No"))); return; }
        if (!isNew) foot.append(el("button", { type: "button", class: "btn danger ghost", onclick: () => drawFoot(true) }, "Elimina"));
        foot.append(el("span", { class: "sp" }), el("button", { type: "button", class: "btn", onclick: close }, "Annulla"), el("button", { type: "submit", class: "btn primary" }, "Salva contatto"));
      };
      drawFoot(false);
      const preview = el("div");
      const drawPreview = () => { preview.replaceChildren(contactActions({ email: f.email.value.trim(), telefono: f.telefono.value.trim() })); };
      f.email.addEventListener("input", drawPreview); f.telefono.addEventListener("input", drawPreview); drawPreview();
      box.append(el("div", { class: "mh" }, el("h2", {}, isNew ? "Nuovo contatto" : fullName(c)), el("button", { class: "btn ghost icon", "aria-label": "Chiudi", html: ICON.x, onclick: close })),
        el("form", { class: "fields", onsubmit: async e => {
          e.preventDefault();
          if (!f.nome.value.trim() && !f.cognome.value.trim()) { err.textContent = "Scrivi almeno il nome o il cognome."; return; }
          if (f.email.value && !f.email.checkValidity()) { err.textContent = "L'indirizzo email non sembra valido."; return; }
          const body = { nome: f.nome.value.trim(), cognome: f.cognome.value.trim(), email: f.email.value.trim(), telefono: f.telefono.value.trim(), note: f.note.value.trim(), createdBy: c.createdBy || S.me, updatedAt: Date.now() };
          if (await save(() => store.set("contacts", c.id || "c" + uid(), body), "Contatto salvato")) close();
        } }, el("div", { class: "row" }, field("Nome", f.nome), field("Cognome", f.cognome)), el("div", { class: "row" }, field("Email", f.email), field("Telefono", f.telefono)),
          el("div", { class: "f" }, el("span", { class: "label" }, "Collegamenti diretti"), preview), field("Note", f.note), err, foot));
    });
  }

  function openOnboarding(editing) {
    const firstFree = SLOTS.find(s => !prof(s));
    let slot = editing ? S.me : (firstFree || null);
    let color = editing ? colorOf(S.me) : null;
    modal((box, close) => {
      const name = el("input", { id: "obName", placeholder: "Il tuo nome", maxlength: 30, value: editing ? nameOf(S.me) : "" });
      const slotsBox = el("div", { class: "slots" });
      const sw = el("div", { class: "swatches", role: "group", "aria-label": "Colore" });
      const used = () => SLOTS.filter(s => s !== slot && prof(s)).map(s => prof(s).color);
      const pickColor = () => { if (!color || used().includes(color)) color = PALETTE.find(c => !used().includes(c)); };
      const draw = () => {
        pickColor();
        slotsBox.replaceChildren(...SLOTS.map((s, i) => {
          const p = prof(s), mine = p && S.myUid && p.uid === S.myUid, other = p && p.uid && S.myUid && p.uid !== S.myUid;
          return el("button", { type: "button", class: "slot", "aria-pressed": s === slot, disabled: editing ? s !== S.me : other,
            onclick: () => { slot = s; if (p) { name.value = p.name; color = p.color; } draw(); } },
            el("span", { class: "av", style: "--c:" + (p ? p.color : "var(--surface-2)") + (p ? "" : ";color:var(--muted)") }, p ? initials(p.name) : i + 1),
            el("span", { class: "nm" }, p ? p.name : "Persona " + (i + 1)),
            el("span", { class: "st" }, p ? (mine || !p.uid || !S.myUid ? "Sono io" : "Occupato") : "Libero"));
        }));
        sw.replaceChildren(...PALETTE.map(c => el("button", { type: "button", class: "sw", style: "--c:" + c, "aria-pressed": c === color, "aria-label": "Colore " + c, disabled: used().includes(c), onclick: () => { color = c; draw(); } })));
      };
      draw();
      const err = el("div", { class: "err", role: "alert" });
      const allTaken = !editing && SLOTS.every(s => prof(s) && prof(s).uid && S.myUid && prof(s).uid !== S.myUid);
      box.append(el("div", { class: "mh" }, el("h2", {}, editing ? "Il tuo profilo" : "Benvenuto nell'agenda"), (editing || S.me) && el("button", { class: "btn ghost icon", "aria-label": "Chiudi", html: ICON.x, onclick: close })),
        el("p", { class: "muted", style: "margin:0" }, editing ? "Cambia nome o colore: gli altri vedranno subito l'aggiornamento." : "L'agenda è condivisa da tre persone, ognuna con il suo colore. Scegli il tuo posto e scrivi il tuo nome."),
        allTaken ? el("p", { class: "err" }, "I tre posti sono già occupati. Puoi consultare l'agenda, ma per modificarla chiedi a chi l'ha condivisa di liberare un posto.") : el("form", { class: "fields", onsubmit: async e => {
          e.preventDefault();
          if (!slot) { err.textContent = "Scegli uno dei tre posti."; return; }
          if (!name.value.trim()) { err.textContent = "Scrivi il tuo nome."; return; }
          const body = { name: name.value.trim(), color, uid: S.myUid || prof(slot)?.uid || null, updatedAt: Date.now() };
          if (await save(() => store.set("profiles", slot, body), editing ? "Profilo aggiornato" : "Ciao " + body.name + "!")) { ls.set("agenda3.me", slot); S.me = slot; close(); render(); }
        } }, el("div", { class: "f" }, el("span", { class: "label" }, "Posto"), slotsBox), field("Nome", name), el("div", { class: "f" }, el("span", { class: "label" }, "Colore identificativo"), sw), err,
          el("div", { class: "foot" }, editing && el("button", { type: "button", class: "btn ghost", onclick: () => { ls.set("agenda3.me", ""); S.me = null; close(); render(); openOnboarding(); } }, "Cambia persona"), el("span", { class: "sp" }), el("button", { class: "btn primary", type: "submit" }, editing ? "Salva" : "Entra nell'agenda"))));
    }, { locked: !editing && !S.me });
  }

  /* ---------- eventi ---------- */
  $("tabAgenda").onclick = () => { S.tab = "agenda"; render(); };
  $("tabRubrica").onclick = () => { S.tab = "rubrica"; render(); };
  $("meChip").onclick = () => S.me ? openOnboarding(true) : openOnboarding();
  $("vDay").onclick = () => { S.view = "day"; ls.set("agenda3.view", "day"); render(); };
  $("vWeek").onclick = () => { S.view = "week"; ls.set("agenda3.view", "week"); render(); };
  const step = n => { S.date = addDays(S.date, n * (S.view === "week" ? 7 : 1)); S.month = new Date(S.date.getFullYear(), S.date.getMonth(), 1); render(); };
  $("prev").onclick = () => step(-1); $("next").onclick = () => step(1);
  $("today").onclick = () => { S.date = new Date(); S.month = new Date(S.date.getFullYear(), S.date.getMonth(), 1); render(); };
  $("mcPrev").onclick = () => { S.month = new Date(S.month.getFullYear(), S.month.getMonth() - 1, 1); renderMini(); };
  $("mcNext").onclick = () => { S.month = new Date(S.month.getFullYear(), S.month.getMonth() + 1, 1); renderMini(); };
  $("newAppt").onclick = () => openAppt(null);
  $("newContact").onclick = () => openContact();
  $("rbSearch").addEventListener("input", renderCards);
  setInterval(() => { if (S.tab === "agenda" && !$("layer").children.length) renderGrid(); }, 60000);

  render();

  /* ---------- avvio ---------- */
  async function boot() {
    let db = null, user = null;
    try { [db, user] = await Promise.all([window.claude?.use?.("db") ?? null, window.claude?.use?.("user") ?? null]); } catch {}
    if (db) { store.db = db; S.myUid = user ? await user.id() : null; }
    else { store.local = true; banner("Modalità locale: i dati restano solo su questo dispositivo. Apri l'agenda da claude.ai per condividerla con le altre persone."); }
    let first = true;
    store.watch("profiles", rows => {
      S.profiles = {}; rows.forEach(r => { if (SLOTS.includes(r.id)) S.profiles[r.id] = r; });
      resolveMe(); render();
      if (first) { first = false; if (!S.me) openOnboarding(); }
    });
    store.watch("appts", rows => { S.appts = rows.filter(r => r.date && r.start && r.end); render(); });
    store.watch("contacts", rows => { S.contacts = rows; render(); });
  }
  boot();
})();
</script>
