<title>Scheda Viva</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: colonna unica da telefono (max 640px), barra schede fissa in basso; il "disco" del mese è il segno distintivo. */
:root{
  --bg:#EDEFF1; --surface:#FFFFFF; --surface-2:#E2E6EA; --line:#D0D6DC;
  --ink:#14181D; --muted:#56606B;
  --accent:#1D4FD0; --accent-soft:#DCE5FB; --accent-ink:#FFFFFF;
  --warn:#9A6400; --warn-soft:#FBEFD5; --danger:#B4231A; --danger-soft:#FBE3E1; --ok:#1B7A45; --ok-soft:#DDF2E5;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1115; --surface:#171B21; --surface-2:#21272F; --line:#2B323B;
  --ink:#E7EBEF; --muted:#9AA4AF;
  --accent:#6C97F2; --accent-soft:#1B2847; --accent-ink:#0A1020;
  --warn:#F0B53C; --warn-soft:#33270F; --danger:#F0675C; --danger-soft:#3A1714; --ok:#4CC584; --ok-soft:#12301F;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1115; --surface:#171B21; --surface-2:#21272F; --line:#2B323B;
  --ink:#E7EBEF; --muted:#9AA4AF;
  --accent:#6C97F2; --accent-soft:#1B2847; --accent-ink:#0A1020;
  --warn:#F0B53C; --warn-soft:#33270F; --danger:#F0675C; --danger-soft:#3A1714; --ok:#4CC584; --ok-soft:#12301F;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;padding-inline:16px;padding-block:0 150px}
.app{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;line-height:1.1;margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:2rem}h2{font-size:1.5rem}h3{font-size:1.2rem}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.label{font-family:var(--f-display);font-weight:600;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* testata */
.top{display:flex;align-items:center;gap:14px;padding-top:16px}
.top .ttl{flex:1;min-width:0}
.top .ttl h1{font-size:1.75rem}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;width:42px;height:42px;display:grid;place-items:center;cursor:pointer}
.iconbtn svg{width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:1.8}
.plate{flex:none;width:76px;height:76px}
.plate text{font-family:var(--f-display);font-weight:700;fill:var(--ink)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.flat{background:transparent;border-style:dashed}
.card.warn{background:var(--warn-soft);border-color:transparent}
.card.danger{background:var(--danger-soft);border-color:transparent}
.card.accent{background:var(--accent-soft);border-color:transparent}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:.8rem;font-weight:600;background:var(--surface-2);color:var(--ink);white-space:nowrap}
.pill.blue{background:var(--accent-soft);color:var(--accent)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.danger{background:var(--danger-soft);color:var(--danger)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 16px;font-weight:600;cursor:pointer;min-height:44px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{background:transparent;border-color:var(--danger);color:var(--danger)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent);padding-inline:6px}
.btn.block{width:100%}
.btn.sm{min-height:34px;padding:4px 10px;font-size:.875rem}
ul.clean{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
ul.dots{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}

/* giorni */
.days{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.day{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.day .k{font-family:var(--f-display);font-size:1.6rem;font-weight:700;line-height:1}
.day.next{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}

/* esercizio */
.ex{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.ex:first-child{border-top:0;padding-top:0}
.ex .head{display:flex;gap:10px;align-items:flex-start}
.ex .idx{font-family:var(--f-display);font-weight:700;font-size:1.3rem;color:var(--accent);min-width:1.4em}
.ex .name{flex:1;min-width:0}
.rx{display:flex;flex-wrap:wrap;gap:6px}
.how{background:var(--surface-2);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:8px;font-size:.92rem}
.how h4{margin:0;font-family:var(--f-display);font-size:.95rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.sets{display:grid;grid-template-columns:auto 1fr 1fr auto;gap:8px;align-items:center}
.sets .h{font-size:.75rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.sets input{width:100%;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;font-variant-numeric:tabular-nums;font-size:1rem}
.sets .n{font-family:var(--f-display);font-weight:700;font-size:1.1rem;width:1.6em;text-align:center}
.chk{width:44px;height:40px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center}
.chk svg{width:20px;height:20px;stroke:var(--muted);fill:none;stroke-width:2.4}
.chk.on{background:var(--ok);border-color:var(--ok)}
.chk.on svg{stroke:var(--surface)}
.sug{font-size:.875rem;background:var(--accent-soft);color:var(--ink);border-radius:8px;padding:8px 10px}
.sug b{color:var(--accent)}
.flagrow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}

/* checklist */
.check{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.check input{width:20px;height:20px;margin-top:2px;accent-color:var(--accent);flex:none}

/* form */
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:10px;width:100%}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:8px;min-width:44px;min-height:44px;font-weight:700;font-family:var(--f-display);font-size:1.1rem;cursor:pointer}
.seg button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

/* tabelle */
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;width:100%;font-size:.9rem}
.tbl th,.tbl td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{font-family:var(--f-display);font-weight:600;letter-spacing:.05em;text-transform:uppercase;font-size:.8rem;color:var(--muted)}

/* grafici */
.chart svg{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .axis{fill:var(--muted);font-size:10px;font-family:var(--f-body)}
.chart .lineP{stroke:var(--accent);stroke-width:2;fill:none}
.chart .area{fill:var(--accent);fill-opacity:.12}
.chart .dot{fill:var(--accent)}
.chart .end{fill:var(--surface);stroke:var(--accent);stroke-width:2.5}

/* barre fisse */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;z-index:20}
nav.tabs .in{display:flex;max-width:640px;width:100%}
nav.tabs button{flex:1;background:none;border:0;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.72rem;font-weight:600;color:var(--muted);cursor:pointer;min-width:0}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
nav.tabs button.on{color:var(--accent)}
.timer{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;padding:0 16px;z-index:19}
.timer .in{max-width:640px;width:100%;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 14px;display:flex;align-items:center;gap:12px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.timer .t{font-family:var(--f-display);font-size:2rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.timer .bar{flex:1;height:6px;background:rgba(127,127,127,.35);border-radius:3px;overflow:hidden}
.timer .bar i{display:block;height:100%;background:var(--accent)}
.timer button{background:transparent;border:1px solid currentColor;color:inherit;border-radius:8px;padding:6px 10px;font-weight:600;cursor:pointer}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet .in{background:var(--surface);width:100%;max-width:640px;border-radius:16px 16px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;max-height:90vh;overflow:auto}
.toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;z-index:40;font-size:.9rem;max-width:calc(100% - 32px)}
details summary{cursor:pointer;font-weight:600}
@media (prefers-reduced-motion:no-preference){.timer .bar i{transition:width .9s linear}}
</style>

<div class="app" id="app">
  <header class="top">
    <svg class="plate" id="plate" viewBox="0 0 100 100" aria-hidden="true"></svg>
    <div class="ttl">
      <div class="label" id="eyebrow">Scheda Viva</div>
      <h1 id="hTitle">Scheda Viva</h1>
      <div class="small muted" id="hSub"></div>
    </div>
    <button class="iconbtn" data-a="tab" data-v="profilo" aria-label="Profilo e impostazioni">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>
    </button>
  </header>
  <main id="view" class="stack" style="gap:16px"></main>
</div>
<div class="timer" id="timer" hidden></div>
<div id="sheet"></div>
<div id="toast" class="toast" hidden></div>
<nav class="tabs"><div class="in" id="tabs"></div></nav>

<script>
/* ============ ESERCIZI ============ */
const SAFE='Respira in modo regolare: espira durante lo sforzo.';
const E={
hip_thrust:{n:'Hip thrust (bilanciere o macchina)',m:'Grande gluteo, femorali',t:'2-0-1-1',inc:5,alt:'hip_thrust_mono',
 c:['Appoggia la parte alta della schiena al bordo della panca, sotto le scapole.','Piedi alla larghezza delle anche: in alto le tibie devono essere verticali.','Mento verso il petto e sguardo avanti per tutta la ripetizione.','Spingi sui talloni ed estendi le anche finché busto e cosce sono in linea.','In alto stringi i glutei per 1 secondo, bacino leggermente in retroversione.'],
 x:['Inarcare la zona lombare per salire di più.','Buttare la testa indietro: carica la cervicale.','Spingere con le punte dei piedi.'],
 h:'Il bilanciere o il pad vanno sulle ossa del bacino, mai sull’inguine: usa un cuscinetto spesso. Se senti pressione o fastidio a sinistra, passa subito alla versione monolaterale.',
 b:'Con la lombare neutra è un ottimo esercizio anche per la schiena.'},
hip_thrust_smith:{n:'Hip thrust al multipower',m:'Grande gluteo, femorali',t:'2-0-1-1',inc:5,alt:'hip_thrust_mono',
 c:['Panca perpendicolare al multipower, bilanciere sopra il bacino con un cuscinetto.','Schiena alta appoggiata alla panca, piedi alla larghezza delle anche.','Sblocca il bilanciere ruotandolo e spingi sui talloni fino a busto e cosce in linea.','Tieni 1 secondo in alto stringendo i glutei, scendi controllato.'],
 x:['Inarcare la schiena in alto.','Scendere di colpo.'],
 h:'Il cuscinetto va sulle ossa del bacino, mai sull’inguine. Se senti pressione, passa alla versione monolaterale.',
 b:'La guida del multipower rende il movimento più stabile.'},
hip_thrust_mono:{n:'Hip thrust monolaterale',m:'Grande e medio gluteo',t:'2-0-1-1',inc:2,alt:'kickback_macchina',
 c:['Schiena sulla panca, un piede a terra al centro, l’altra gamba piegata in aria.','Sguardo avanti, costole basse.','Spingi sul tallone a terra fino all’estensione completa dell’anca.','Il bacino resta dritto: non deve ruotare verso la gamba libera.','Inizia a corpo libero; poi aggiungi un manubrio appoggiato sulla coscia che lavora.'],
 x:['Lasciar cadere il bacino da un lato.','Spingere con la gamba in aria.'],
 h:'Nessuna pressione sull’inguine: è la variante più sicura per i glutei nel tuo caso.',b:'Carico minimo sulla colonna.'},
rdl_manubri:{n:'Stacco rumeno con manubri',m:'Femorali, grande gluteo',t:'3-0-1-0',inc:2,alt:'pull_through',
 c:['In piedi, piedi alla larghezza delle anche, ginocchia morbide.','Porta il bacino indietro come per chiudere una porta con il sedere.','Manubri vicini alle cosce, schiena neutra, scapole leggermente indietro.','Scendi finché senti tirare i femorali, di solito poco sotto le ginocchia, senza arrotondare la schiena.','Risali spingendo le anche in avanti e stringendo i glutei.'],
 x:['Arrotondare la schiena per scendere di più.','Piegare troppo le ginocchia: diventa uno squat.','Alzare la testa per guardarsi allo specchio.'],
 h:'Carico moderato e sempre lontano dal cedimento. Niente apnea: espira mentre risali.',
 b:'Se hai mal di schiena riduci l’ampiezza e il carico. Se la lombare si fa sentire, passa al pull-through al cavo.'},
iperestensioni:{n:'Iperestensioni a 45° per glutei',m:'Grande gluteo, femorali',t:'2-0-1-1',inc:2.5,alt:'pull_through',
 c:['Regola il pad appena sotto la piega dell’anca: deve appoggiare sulle cosce, non sulla pancia.','Punte dei piedi leggermente in fuori, parte alta della schiena un po’ arrotondata, mento verso il petto.','Scendi piegandoti alle anche.','Risali spingendo il bacino contro il pad e stringendo i glutei. Fermati quando il corpo è in linea.','Quando 15 ripetizioni diventano facili, tieni un disco al petto.'],
 x:['Salire oltre la linea del corpo inarcando la lombare.','Muoversi di slancio.'],
 h:'Controlla che il pad non prema sull’inguine. '+SAFE,b:'Con questa tecnica la lombare lavora poco. In caso di dolore riduci l’ampiezza.'},
pull_through:{n:'Pull-through al cavo',m:'Grande gluteo, femorali',t:'2-0-1-1',inc:2.5,alt:'hip_thrust_mono',
 c:['Cavo basso con la corda: dai le spalle alla macchina, con la corda tra le gambe.','Fai due passi avanti, piedi un po’ più larghi delle spalle.','Porta il bacino indietro con la schiena neutra e lascia passare la corda tra le gambe.','Torna su spingendo le anche in avanti e stringi forte i glutei.','Le braccia restano rilassate e distese: servono solo da ganci.'],
 x:['Tirare con le braccia.','Accosciarsi invece di piegarsi alle anche.'],
 h:'Mette poca pressione sull’addome: è una delle scelte migliori nel tuo caso.',b:'Molto delicato sulla schiena.'},
affondi_inversi:{n:'Affondi indietro con manubri',m:'Glutei, quadricipiti',t:'2-0-1-0',inc:2,alt:'step_up',
 c:['Manubri lungo i fianchi, busto leggermente inclinato in avanti: lavorano di più i glutei.','Fai un passo lungo indietro e scendi finché il ginocchio dietro quasi tocca terra.','Il peso resta sul tallone della gamba davanti.','Risali spingendo con la gamba davanti.','Fai tutte le ripetizioni da un lato, poi cambia.'],
 x:['Il ginocchio davanti crolla verso l’interno.','Passo troppo corto: lavora quasi solo il quadricipite.'],
 h:'Inizia con un carico leggero. Se scendere in profondità dà tensione all’inguine sinistro, riduci la profondità.',b:'Stressa le ginocchia meno degli affondi in avanti.'},
bulgaro:{n:'Squat bulgaro con manubri',m:'Glutei, quadricipiti, adduttori',t:'3-0-1-0',inc:2,alt:'step_up',
 c:['Piede dietro appoggiato sulla panca, piede davanti a circa un passo lungo di distanza.','Busto leggermente inclinato in avanti per spostare il lavoro sui glutei.','Scendi in verticale finché la coscia davanti è parallela a terra.','Spingi sul tallone davanti per risalire.','Fai la prima serie senza manubri per trovare la posizione.'],
 x:['Piede davanti troppo vicino alla panca.','Rimbalzare in basso.'],
 h:'Con la gamba sinistra dietro, l’inguine sinistro si allunga: se tira o dà fastidio, riduci la profondità o passa allo step-up.',b:'Ottima alternativa allo squat con bilanciere: non carica la colonna.'},
step_up:{n:'Step-up su panca con manubri',m:'Glutei, quadricipiti',t:'2-0-1-0',inc:2,alt:'leg_press_mono',
 c:['Panca o step all’altezza del ginocchio.','Appoggia tutto il piede sulla panca, busto leggermente in avanti.','Sali spingendo solo con la gamba sopra, senza aiutarti con quella a terra.','Scendi lentamente e con controllo.','Fai un lato, poi l’altro.'],
 x:['Spingersi con il piede a terra.','Ginocchio che va verso l’interno.'],
 h:'Molto sicuro: busto verticale e poca pressione sull’addome.',b:'Non carica la colonna se usi manubri leggeri.'},
abductor:{n:'Abductor alla macchina',m:'Medio e piccolo gluteo',t:'2-1-1-0',inc:5,alt:'abduzione_cavo',
 c:['Schiena appoggiata, mani sulle maniglie.','Apri le gambe in modo controllato e tieni la posizione aperta per 1 secondo.','Torna lentamente senza far sbattere i pesi.'],
 x:['Usare lo slancio.','Carico troppo alto con un movimento troppo corto.'],h:'Sicuro. '+SAFE,b:''},
abduzione_cavo:{n:'Abduzione dell’anca al cavo',m:'Medio gluteo',t:'2-1-1-0',inc:2.5,alt:'abductor',
 c:['Cavigliera al cavo basso; mettiti di fianco alla macchina con la gamba più lontana agganciata.','Tieniti alla macchina con il busto dritto.','Porta la gamba di lato senza ruotare la punta del piede verso l’alto.','Torna lentamente.'],
 x:['Inclinare il busto per alzare di più la gamba.'],h:'Sicuro. '+SAFE,b:''},
abductor_avanti:{n:'Abductor con busto in avanti',m:'Grande e medio gluteo (parte alta)',t:'2-1-1-0',inc:5,alt:'abductor',
 c:['Alla macchina abductor staccati dallo schienale e inclina il busto in avanti di circa 45°, schiena dritta.','Apri le gambe e tieni per 1 secondo.','Questa variante coinvolge di più la parte alta del grande gluteo, quella che dà forma.'],
 x:['Arrotondare la schiena.'],h:'Sicuro. '+SAFE,b:'Se la schiena si stanca, torna alla versione con lo schienale.'},
leg_curl_seduto:{n:'Leg curl da seduto',m:'Femorali',t:'2-1-1-0',inc:2.5,alt:'leg_curl_sdraiato',
 c:['Regola lo schienale in modo che il ginocchio sia allineato al perno della macchina.','Blocca bene le cosce con il rullo.','Piega le ginocchia fino in fondo e fai una pausa di 1 secondo.','Ritorna lentamente.'],
 x:['Staccare il bacino dal sedile.','Ritorno veloce.'],h:'Sicuro. '+SAFE,b:''},
leg_curl_sdraiato:{n:'Leg curl da sdraiato',m:'Femorali',t:'2-1-1-0',inc:2.5,alt:'leg_curl_seduto',
 c:['Sdraiati a pancia in giù con le ginocchia appena fuori dal pad.','Tieni il bacino schiacciato contro il pad.','Porta il rullo verso i glutei, fai una pausa e torna lentamente.'],
 x:['Sollevare il bacino.'],h:'Da sdraiato il pad preme sul basso addome: se senti pressione all’inguine usa la versione da seduto.',b:'Non inarcare la schiena.'},
leg_press:{n:'Leg press',m:'Quadricipiti, glutei',t:'3-0-1-0',inc:5,alt:'leg_press_mono',

const profRef=()=>db.doc('data/users/'+uid+'/profile');
const sessCol=()=>profRef().collection('sessions');
function cloudFail(){cloudStatus='errore di sincronizzazione: i dati restano salvati su questo dispositivo';if(ui.tab==='profilo')render()}
function queueCloudProfile(){if(!db)return;clearTimeout(profTimer);profTimer=setTimeout(()=>{const body=JSON.parse(JSON.stringify({profile:state.profile,swaps:state.swaps,flags:state.flags.slice(-200),bw:state.bw.slice(-400),updatedAt:state.updatedAt}));cloudChain=cloudChain.then(()=>profRef().set(body)).catch(cloudFail)},800)}
function cloudSession(s){if(!db)return;const body=JSON.parse(JSON.stringify(s));cloudChain=cloudChain.then(()=>sessCol().doc(s.id).set(body)).catch(cloudFail)}
function cloudDel(id){if(!db)return;cloudChain=cloudChain.then(()=>sessCol().doc(id).delete()).catch(cloudFail)}
async function initCloud(){
 try{
  if(!window.claude||!window.claude.use)return;
  const [d,u]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
  const id=u?await u.id():null;
  if(!d||!id)return;
  db=d;uid=id;
  const [ps,ss]=await Promise.all([profRef().get(),sessCol().get()]);
  const remote=ps.exists?ps.data():null;
  const rs=ss.docs.map(x=>JSON.parse(JSON.stringify(x.data())));
  const localIds=new Set(state.sessions.map(s=>s.id)),remoteIds=new Set(rs.map(s=>s.id));
  rs.forEach(s=>{if(!localIds.has(s.id))state.sessions.push(s)});
  state.sessions.sort((a,b)=>(a.ts||0)-(b.ts||0));
  const toUp=state.sessions.filter(s=>!remoteIds.has(s.id));
  if(remote&&(remote.updatedAt||0)>(state.updatedAt||0)){
   const r=JSON.parse(JSON.stringify(remote));
   state.profile=Object.assign(fresh().profile,r.profile||{});state.swaps=r.swaps||{};state.flags=r.flags||[];state.bw=r.bw||[];state.updatedAt=r.updatedAt;
  }else{queueCloudProfile()}
  toUp.forEach(cloudSession);
  lsSet();cloudStatus='sincronizzato con il tuo account';render();
 }catch(e){db=null;cloudStatus='solo su questo dispositivo'}
}

/* ============ LOGICA ============ */
function templates(){return state.profile.giorni==3?T3:T4}
function cycle(date){const d=Math.max(0,daysBetween(state.profile.inizio,date||iso()));return {month:Math.floor(d/28)+1,week:Math.floor((d%28)/7)+1,left:28-d%28}}
function phaseIdx(m){return m===1?0:1+((m-2)%3)}
function rirTxt(rpe){const r=10-rpe;return Number.isInteger(r)?String(r):Math.floor(r)+'–'+Math.ceil(r)}
function rxFor(role,m,w){
 const b=PHASES[phaseIdx(m)][role];const r={s:b.s,rest:b.rest,deload:false};
 if(role==='core'){if(w===4){r.s=Math.max(2,r.s-1);r.deload=true}return r}
 r.r=[b.r[0],b.r[1]];r.rpe=b.rpe;
 if(w===2)r.rpe+=.5;
 if(w===3){if(role!=='iso')r.s+=1;r.rpe+=.5}
 if(w===4){r.s=Math.max(2,r.s-1);r.rpe=6;r.deload=true}
 r.rpe=Math.min(r.rpe,role==='iso'?8.5:8);return r}
function resolve(id){const seen=new Set();while(state.swaps[id]&&!seen.has(id)&&E[state.swaps[id]]){seen.add(id);id=state.swaps[id]}return id}
function dayPlan(key,m,w){
 const T=templates()[key];const v=(m-1)%3;const used=new Set();
 const ex=T.slots.map(sl=>{let id=resolve(sl.p[v%sl.p.length]);if(used.has(id)){const a=resolve(E[id].alt);if(!used.has(a))id=a}used.add(id);return {id,role:sl.r,rx:rxFor(sl.r,m,w)}});
 return {key,nome:T.nome,tipo:T.tipo,ex}}
function nextKey(){const keys=Object.keys(templates());for(let i=state.sessions.length-1;i>=0;i--){const k=keys.indexOf(state.sessions[i].dayKey);if(k>=0)return keys[(k+1)%keys.length]}return keys[0]}
function history(id,n){const out=[];for(let i=state.sessions.length-1;i>=0&&out.length<n;i--){const s=state.sessions[i];const e=s.exercises.find(x=>x.id===id&&x.sets.some(t=>+t.kg>0&&+t.reps>0));if(e)out.push({s,e})}return out}
const r05=x=>Math.max(0,Math.round(x*2)/2);
function e1(st){return +st.kg*(1+ +st.reps/30)}
function suggest(id,rx,m){
 const ex=E[id];if(ex.bw||!rx.r)return null;
 const H=history(id,3);
 const first='Primo approccio: scegli un carico con cui chiudi '+rx.r[1]+' ripetizioni lasciandone '+rirTxt(rx.rpe)+' in riserva. Annotalo: dalla prossima volta te lo calcolo io.';
 if(!H.length)return {kg:null,note:first};
 const L=H[0];const sets=L.e.sets.filter(s=>+s.kg>0&&+s.reps>0);const top=Math.max(...sets.map(s=>+s.kg));const inc=ex.inc||2.5;let kg,note;
 if(L.s.month===m&&L.e.lo===rx.r[0]&&L.e.hi===rx.r[1]&&!L.s.deload){
  const allTop=sets.length>=2&&sets.every(s=>+s.reps>=rx.r[1]);const low=sets.filter(s=>+s.reps<rx.r[0]).length>=2;
  if(L.e.flag){kg=top*.85;note='L’ultima volta hai segnalato un fastidio: riparti più leggero.'}
  else if((L.s.rpe||0)>=9){kg=top;note='L’ultima seduta è stata molto pesante: mantieni lo stesso carico.'}
  else if(allTop){kg=top+inc;note='+'+inc+' kg: l’ultima volta hai chiuso tutte le serie al massimo delle ripetizioni.'}
  else if(low){kg=top*.92;note='Scendi un po’: diverse serie sono rimaste sotto il minimo.'}
  else{kg=top;note='Stesso carico: prova ad aggiungere 1 ripetizione per serie.'}
 }else{
  const best=Math.max(...H.flatMap(h=>h.e.sets.filter(s=>+s.kg>0&&+s.reps>0).map(e1)));
  kg=best/(1+(rx.r[1]+(10-rx.rpe))/30);note='Nuovo schema di ripetizioni: carico stimato dalle tue ultime sedute.';
 }
 if(rx.deload){kg=kg*.9;note='Settimana di scarico: circa −10%. Esegui con calma e tecnica perfetta.'}
 return {kg:r05(kg),note}}

/* ============ UTIL UI ============ */
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=s=>document.querySelector(s);
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,2600)}
function rxPills(ex){const rx=ex.rx,e=E[ex.id];const out=[];
 if(e.core)out.push('<span class="pill blue num">'+rx.s+' × '+esc(e.core)+'</span>');
 else out.push('<span class="pill blue num">'+rx.s+' × '+rx.r[0]+'–'+rx.r[1]+'</span>','<span class="pill num">RPE '+String(rx.rpe).replace('.',',')+' · '+rirTxt(rx.rpe)+' in riserva</span>');
 out.push('<span class="pill num">Recupero '+(rx.rest>=120?(rx.rest/60).toString().replace('.',',')+' min':rx.rest+' s')+'</span>');
 if(e.t)out.push('<span class="pill num">Tempo '+esc(e.t)+'</span>');
 if(rx.deload)out.push('<span class="pill warn">Scarico</span>');
 return '<div class="rx">'+out.join('')+'</div>'}
function howBlock(id){const e=E[id];return '<div class="how">'+
 '<h4>Esecuzione</h4><ol style="margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px">'+e.c.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ol>'+
 '<h4>Errori da evitare</h4><ul class="dots">'+e.x.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>'+
 '<h4>Ernia</h4><p>'+esc(e.h)+'</p>'+(e.b?'<h4>Schiena e cervicale</h4><p>'+esc(e.b)+'</p>':'')+
 (e.t&&/\d-\d/.test(e.t)?'<p class="small muted">Tempo '+esc(e.t)+': secondi di discesa – pausa in basso – salita – pausa in alto.</p>':'')+'</div>'}

/* ============ PIASTRA (mese/settimana) ============ */
function drawPlate(){
 const c=cycle();const r=40,C=2*Math.PI*r,gap=6,seg=C/4-gap;let arcs='';
 for(let i=0;i<4;i++){const done=i<c.week-1,cur=i===c.week-1;
  arcs+='<circle cx="50" cy="50" r="'+r+'" fill="none" stroke="'+(done||cur?'var(--accent)':'var(--line)')+'" stroke-opacity="'+(done?'.45':'1')+'" stroke-width="'+(cur?9:7)+'" stroke-dasharray="'+seg.toFixed(2)+' '+(C-seg).toFixed(2)+'" stroke-dashoffset="'+(-(i*C/4)-gap/2).toFixed(2)+'" transform="rotate(-90 50 50)"/>'}
 $('#plate').innerHTML='<circle cx="50" cy="50" r="31" fill="var(--surface)" stroke="var(--line)"/><circle cx="50" cy="50" r="6" fill="var(--surface-2)" stroke="var(--line)"/>'+arcs+
  '<text x="50" y="40" text-anchor="middle" font-size="11" letter-spacing="1" fill="var(--muted)" style="fill:var(--muted)">MESE</text><text x="50" y="72" text-anchor="middle" font-size="22">'+c.month+'</text>';
 $('#eyebrow').textContent='Mese '+c.month+' · Settimana '+c.week+' di 4';
 $('#hTitle').textContent=PHASES[phaseIdx(c.month)].nome;
 $('#hSub').textContent=c.left===1?'La nuova scheda parte domani':'Nuova scheda tra '+c.left+' giorni';
}

/* ============ VISTE ============ */

 if(!state.profile.accettato)h+='<section class="card warn"><h2>Prima di iniziare</h2><p>La scheda tiene conto dell’ernia inguinale sinistra, del mal di schiena e della cervicale, ma non sostituisce il parere del medico. Chiedi al tuo medico di base (è gratuito) se puoi allenarti con i pesi e mostragli il tipo di esercizi nella sezione <b>Esercizi</b>.</p><p>Nel primo mese i carichi sono volutamente leggeri: riparti dopo 6 mesi di stop.</p><button class="btn primary" data-a="accept">Ho capito, inizio</button></section>';
 const lastS=state.sessions[state.sessions.length-1];
 if(lastS&&lastS.inguine&&daysBetween(lastS.date,iso())<=7)h+='<section class="card danger"><h3>Hai segnalato un fastidio all’inguine</h3><p>Se il fastidio dura più di 1–2 giorni o il rigonfiamento sembra più grande, sospendi gli allenamenti per le gambe e senti il medico. Se il dolore diventa forte, il rigonfiamento è duro e non rientra, oppure hai nausea, vai subito al pronto soccorso.</p></section>';

 h+='<section class="card accent"><div class="label">Settimana '+c.week+'</div><p>'+esc(WEEKS[c.week-1])+'</p></section>';
 const recent=state.sessions.slice(-3).reverse();

 return h}

  s+='<div class="row between"><div class="row" style="gap:4px"><button class="btn ghost sm" data-a="addset" data-i="'+i+'">+ Serie</button><button class="btn ghost sm" data-a="how" data-v="w'+i+'">'+(open?'Chiudi':'Come si fa')+'</button><button class="btn ghost sm" data-a="replace" data-i="'+i+'" data-v="'+e.alt+'" title="Macchina occupata o esercizio non adatto oggi">Cambia</button></div></div>';
  if(open)s+=howBlock(x.id);

  return s+'</div>'}).join('')+'</section>';
 h+='<section class="stack"><button class="btn primary block" data-a="finishOpen">Termina allenamento</button>'+(ui.confirm==='discard'?'<div class="card danger"><p>Eliminare questo allenamento senza salvarlo?</p><div class="row"><button class="btn danger" data-a="discard">Sì, elimina</button><button class="btn" data-a="cancelConfirm">Annulla</button></div></div>':'<button class="btn ghost" data-a="askDiscard">Annulla allenamento</button>')+'</section>';
 return h}

 h+='<div class="tbl"><table><thead><tr><th>Sett.</th><th>Cosa cambia</th></tr></thead><tbody>'+WEEKS.map((w,i)=>'<tr'+(!ui.planNext&&i===c0.week-1?' style="background:var(--accent-soft)"':'')+'><td class="num"><b>'+(i+1)+'</b></td><td>'+esc(w)+'</td></tr>').join('')+'</tbody></table></div>';

 const P=state.profile;const bmr=10*P.peso+6.25*P.altezza-5*P.eta+5;const tdee=Math.round(bmr*1.55/50)*50;const target=tdee+250;

 h+='<section class="card"><h3>Routine contro mal di schiena e cervicale</h3><p class="small muted">5 minuti, anche a casa, nei giorni senza palestra.</p><ul class="dots">'+ROUTINE.map(r=>'<li>'+esc(r)+'</li>').join('')+'</ul></section>';
 return h}

function lineChart(pts,unit){
 if(pts.length<2)return '<p class="small muted">Servono almeno 2 registrazioni per il grafico.</p>';
 const W=320,H=170,L=38,R=12,T=12,B=26;const ys=pts.map(p=>p.y);let lo=Math.min(...ys),hi=Math.max(...ys);if(hi-lo<1){lo-=1;hi+=1}const pad=(hi-lo)*.15;lo-=pad;hi+=pad;
 const t0=Date.parse(pts[0].x),t1=Date.parse(pts[pts.length-1].x)||t0+1;const X=x=>L+(W-L-R)*((Date.parse(x)-t0)/Math.max(1,t1-t0));const Y=y=>T+(H-T-B)*(1-(y-lo)/(hi-lo));
 let g='';for(let i=0;i<=3;i++){const v=lo+(hi-lo)*i/3;const y=Y(v);g+='<line class="grid" x1="'+L+'" x2="'+(W-R)+'" y1="'+y.toFixed(1)+'" y2="'+y.toFixed(1)+'"/><text class="axis" x="'+(L-6)+'" y="'+(y+3).toFixed(1)+'" text-anchor="end">'+(Math.round(v*10)/10).toString().replace('.',',')+'</text>'}
 const d=pts.map((p,i)=>(i?'L':'M')+X(p.x).toFixed(1)+' '+Y(p.y).toFixed(1)).join(' ');
 const area=d+' L'+X(pts[pts.length-1].x).toFixed(1)+' '+(H-B)+' L'+X(pts[0].x).toFixed(1)+' '+(H-B)+' Z';const last=pts[pts.length-1];
 return '<div class="chart"><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Andamento in '+unit+'">'+g+'<path class="area" d="'+area+'"/><path class="lineP" d="'+d+'"/>'+pts.slice(0,-1).map(p=>'<circle class="dot" r="2.5" cx="'+X(p.x).toFixed(1)+'" cy="'+Y(p.y).toFixed(1)+'"/>').join('')+'<circle class="end" r="4.5" cx="'+X(last.x).toFixed(1)+'" cy="'+Y(last.y).toFixed(1)+'"/><text class="axis" x="'+L+'" y="'+(H-8)+'">'+fmtDate(pts[0].x)+'</text><text class="axis" x="'+(W-R)+'" y="'+(H-8)+'" text-anchor="end">'+fmtDate(last.x)+'</text></svg></div>'}

function vProgressi(){
 let h='<section class="card"><div class="row between"><h3>Peso corporeo</h3><span class="pill num">'+(state.bw.length?String(state.bw[state.bw.length-1].kg).replace('.',',')+' kg':'—')+'</span></div>'+lineChart(state.bw.map(b=>({x:b.d,y:+b.kg})),'kg')+
  '<div class="row"><input id="bwIn" class="num" inputmode="decimal" placeholder="Peso di oggi (kg)" style="flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:10px"><button class="btn primary" data-a="bwAdd">Salva</button></div><p class="small muted">Pesati 1–2 volte a settimana, al mattino a digiuno.</p></section>';
 const ids=[...new Set(state.sessions.flatMap(s=>s.exercises.filter(e=>!E[e.id]?.bw&&e.sets.some(t=>+t.kg>0)).map(e=>e.id)))].filter(id=>E[id]);
 h+='<section class="card"><h3>Forza per esercizio</h3>';
 if(!ids.length)h+='<p class="muted">Qui comparirà il grafico dei tuoi progressi dopo il primo allenamento registrato. Il valore è il <b>massimale stimato</b> (calcolato dai kg e dalle ripetizioni, senza mai provarlo davvero).</p>';
 else{const sel=ids.includes(ui.progEx)?ui.progEx:ids[0];const pts=[];state.sessions.forEach(s=>{const e=s.exercises.find(x=>x.id===sel);if(!e)return;const v=e.sets.filter(t=>+t.kg>0&&+t.reps>0).map(e1);if(v.length)pts.push({x:s.date,y:Math.round(Math.max(...v)*10)/10})});
  h+='<div class="field"><label class="label" for="progSel">Esercizio</label><select id="progSel" data-f="progEx">'+ids.map(id=>'<option value="'+id+'"'+(id===sel?' selected':'')+'>'+esc(E[id].n)+'</option>').join('')+'</select></div>'+lineChart(pts,'kg')+'<p class="small muted">Massimale stimato in kg (formula di Epley). Serve solo per vedere i progressi, non da provare.</p>'}
 h+='</section><section class="card"><h3>Storico</h3>';
 if(!state.sessions.length)h+='<p class="muted">Nessun allenamento registrato. Inizia dalla scheda <b>Oggi</b>.</p>';
 else h+='<ul class="clean">'+state.sessions.slice().reverse().map(s=>'<li class="stack" style="border-top:1px solid var(--line);padding-top:8px;gap:4px"><div class="row between"><b>'+fmtDate(s.date)+' · '+esc(s.dayKey)+' '+esc(s.dayName)+'</b><span class="pill num">Fatica '+s.rpe+'/10</span></div><div class="small muted">'+s.exercises.map(e=>esc(E[e.id]?E[e.id].n:e.id)+' '+e.sets.map(t=>(t.kg?String(t.kg).replace('.',',')+'×':'')+t.reps).join(', ')).join(' · ')+'</div>'+([s.inguine&&'inguine',s.schiena&&'schiena',s.cervicale&&'cervicale'].filter(Boolean).length?'<div><span class="pill danger">Fastidio: '+[s.inguine&&'inguine',s.schiena&&'schiena',s.cervicale&&'cervicale'].filter(Boolean).join(', ')+'</span></div>':'')+(s.note?'<div class="small">“'+esc(s.note)+'”</div>':'')+(ui.confirm==='del'+s.id?'<div class="row"><button class="btn danger sm" data-a="delSession" data-v="'+s.id+'">Conferma eliminazione</button><button class="btn sm" data-a="cancelConfirm">Annulla</button></div>':'<div><button class="btn ghost sm" data-a="askDel" data-v="'+s.id+'">Elimina</button></div>')+'</li>').join('')+'</ul>';
 return h+'</section>'}

function vEsercizi(){
 const q=ui.q.trim().toLowerCase();const ids=Object.keys(E).filter(id=>!q||(E[id].n+' '+E[id].m).toLowerCase().includes(q));
 let h='<section class="stack"><h2>Esercizi</h2><p class="muted">Tutti gli esercizi della scheda, già filtrati per ernia inguinale, schiena e cervicale. Mancano di proposito: squat e stacco pesanti con bilanciere, crunch, sit-up, sollevamento gambe, lento avanti in piedi e scrollate.</p><input id="search" data-f="q" value="'+esc(ui.q)+'" placeholder="Cerca per nome o muscolo" style="border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px"></section><section class="card">';
 h+=ids.map(id=>{const e=E[id],open=ui.open['l'+id];return '<div class="ex"><div class="row between" style="flex-wrap:nowrap;align-items:flex-start"><div class="name" style="min-width:0"><h3>'+esc(e.n)+'</h3><div class="small muted">'+esc(e.m)+'</div></div><button class="btn sm" data-a="how" data-v="l'+id+'">'+(open?'Chiudi':'Dettagli')+'</button></div>'+(open?howBlock(id)+'<p class="small muted">Alternativa: '+esc(E[e.alt].n)+'</p>':'')+'</div>'}).join('')||'<p class="muted">Nessun esercizio trovato.</p>';
 return h+'</section>'}

function vSicurezza(){
 return '<section class="card danger"><h2>Vai subito al pronto soccorso se</h2><ul class="dots"><li>il dolore all’inguine diventa forte e improvviso;</li><li>il rigonfiamento è duro, dolente e non rientra quando ti sdrai;</li><li>compaiono nausea, vomito, febbre o la pancia gonfia e non riesci ad andare di corpo.</li></ul><p>Possono essere segni di un’ernia strozzata: è un’emergenza.</p></section>'+
 '<section class="card warn"><h3>Fermati e senti il medico se</h3><ul class="dots"><li>il rigonfiamento diventa più grande o lo senti più spesso;</li><li>il fastidio all’inguine dura più di 1–2 giorni dopo l’allenamento;</li><li>il mal di schiena scende lungo la gamba, oppure senti formicolii o perdi forza alle braccia o alle gambe.</li></ul></section>'+
 '<section class="card"><h3>Le regole della scheda</h3><ul class="dots"><li><b>Mai al cedimento.</b> Ogni serie finisce con almeno 2 ripetizioni di riserva (RPE massimo 8).</li><li><b>Niente apnea.</b> Espira durante lo sforzo, inspira nel ritorno. Non trattenere il fiato per “caricarti”.</li><li><b>Niente carichi sulla colonna.</b> Squat e stacco pesanti con bilanciere sono sostituiti da leg press, bulgaro, hip thrust e pull-through.</li><li><b>Addome sicuro.</b> Dead bug, bird dog, Pallof press e plank laterale invece di crunch e sollevamenti delle gambe.</li><li><b>Cervicale.</b> Lat machine sempre davanti, niente scrollate, spalle basse nelle alzate, face pull per la postura.</li><li><b>Come prendi i pesi conta.</b> Solleva manubri e dischi da terra piegando le gambe e espirando.</li><li><b>Fastidio = stop.</b> Usa i pulsanti “Fastidio?” durante l’allenamento: l’esercizio viene sostituito in automatico dalle sedute successive.</li></ul></section>'+
 '<section class="card accent"><h3>Il primo passo è gratuito</h3><p>Chiedi al tuo medico di base se puoi allenarti con i pesi e se è previsto un intervento. Se ti operano, dopo l’intervento questa scheda va sospesa e ripresa solo con il suo via libera.</p></section>'}

function vProfilo(){
 const P=state.profile;const sw=Object.keys(state.swaps).filter(k=>E[k]&&E[state.swaps[k]]);
 let h='<section class="card"><h2>Il tuo profilo</h2><div class="grid2">'+
  '<div class="field"><label class="label" for="pEta">Età</label><input id="pEta" inputmode="numeric" data-p="eta" value="'+P.eta+'"></div>'+
  '<div class="field"><label class="label" for="pAlt">Altezza (cm)</label><input id="pAlt" inputmode="numeric" data-p="altezza" value="'+P.altezza+'"></div>'+
  '<div class="field"><label class="label" for="pPeso">Peso (kg)</label><input id="pPeso" inputmode="decimal" data-p="peso" value="'+P.peso+'"></div>'+
  '<div class="field"><label class="label" for="pIni">Inizio del programma</label><input id="pIni" type="date" data-p="inizio" value="'+P.inizio+'"></div></div>'+
  '<div class="field"><span class="label">Allenamenti a settimana</span><div class="seg">'+[3,4].map(n=>'<button data-a="giorni" data-v="'+n+'" class="'+(P.giorni==n?'on':'')+'">'+n+'</button>').join('')+'</div><span class="small muted">Con 4: due giorni gambe e glutei e due parte alta. Con 3: gambe due volte e parte alta divisa su due giorni.</span></div>'+
  '<p class="small muted">Obiettivo: massa e tonificazione, con priorità a glutei e gambe. Condizioni considerate: ernia inguinale sinistra (contenuto adiposo, asintomatica), mal di schiena intermittente, cervicale.</p></section>';
 h+='<section class="card"><h3>Esercizi sostituiti</h3>'+(sw.length?'<ul class="clean">'+sw.map(k=>'<li class="row between"><span class="small">'+esc(E[k].n)+' → <b>'+esc(E[state.swaps[k]].n)+'</b></span><button class="btn sm" data-a="unswap" data-v="'+k+'">Ripristina</button></li>').join('')+'</ul>':'<p class="muted small">Nessuno. Quando segnali un fastidio, l’esercizio viene sostituito e compare qui.</p>')+'</section>';
 h+='<section class="card"><h3>Ciclo</h3><p class="small">Il programma è iniziato il <b>'+fmtDate(P.inizio)+'</b>. Se hai saltato settimane per malattia o ferie, ripartire dal mese 1 è la scelta più prudente.</p>'+(ui.confirm==='reset'?'<div class="row"><button class="btn danger" data-a="resetCycle">Sì, riparti da oggi</button><button class="btn" data-a="cancelConfirm">Annulla</button></div>':'<button class="btn" data-a="askReset">Riparti dal mese 1</button>')+'</section>';
 h+='<section class="card"><h3>I tuoi dati</h3><p class="small">Stato: <b>'+esc(cloudStatus)+'</b>.</p><details><summary>Backup manuale</summary><div class="stack" style="margin-top:10px"><p class="small muted">Copia il testo e conservalo (per esempio in una nota). Per ripristinare, incollalo qui sotto e premi Importa.</p><button class="btn" data-a="copyExport">Copia backup</button><textarea id="impTxt" rows="4" placeholder="Incolla qui un backup" style="border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:10px;width:100%"></textarea><button class="btn" data-a="importData">Importa backup</button></div></details></section>';
 return h}

/* ============ RENDER ============ */
const TABS=[['oggi','Oggi','<path d="M4 10h16M6 6v8M18 6v8M3 8v4M21 8v4M9 10h6"/>'],['piano','Piano','<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/>'],['progressi','Progressi','<path d="M4 19l5-6 4 3 7-9"/><path d="M15 7h5v5"/>'],['esercizi','Esercizi','<path d="M5 5h14v14H5z"/><path d="M9 9h6M9 13h6M9 17h3"/>'],['sicurezza','Sicurezza','<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M12 8v5M12 16v.5"/>']];
function render(){
 drawPlate();
 $('#tabs').innerHTML=TABS.map(t=>'<button data-a="tab" data-v="'+t[0]+'" class="'+(ui.tab===t[0]?'on':'')+'" aria-current="'+(ui.tab===t[0]?'page':'false')+'"><svg viewBox="0 0 24 24">'+t[2]+'</svg>'+t[1]+'</button>').join('');
 const V={oggi:vOggi,piano:vPiano,progressi:vProgressi,esercizi:vEsercizi,sicurezza:vSicurezza,profilo:vProfilo}[ui.tab]||vOggi;
 $('#view').innerHTML=V();
 renderSheet();
}
function renderSheet(){
 const f=ui.finish;if(!f){$('#sheet').innerHTML='';return}
 $('#sheet').innerHTML='<div class="sheet"><div class="in" role="dialog" aria-label="Fine allenamento"><h2>Com’è andata?</h2><div class="field"><span class="label">Fatica complessiva (RPE)</span><div class="seg">'+[5,6,7,8,9,10].map(n=>'<button data-a="rpe" data-v="'+n+'" class="'+(f.rpe===n?'on':'')+'">'+n+'</button>').join('')+'</div><span class="small muted">6 = facile, 8 = impegnativo ma sotto controllo, 10 = al limite.</span></div>'+
 '<div class="stack"><span class="label">Hai sentito fastidio?</span>'+[['inguine','All’inguine'],['schiena','Alla schiena'],['cervicale','Alla cervicale']].map(k=>'<label class="check"><input type="checkbox" data-ff="'+k[0]+'" '+(f[k[0]]?'checked':'')+'><span>'+k[1]+'</span></label>').join('')+'</div>'+
 '<div class="field"><label class="label" for="fNote">Note</label><textarea id="fNote" data-ff="note" rows="2" placeholder="Per esempio: leg press occupata, ho dormito poco…">'+esc(f.note||'')+'</textarea></div>'+
 '<div class="row"><button class="btn primary" data-a="finishSave" style="flex:1">Salva allenamento</button><button class="btn" data-a="finishCancel">Indietro</button></div></div></div>'}

/* ============ TIMER ============ */
let tm={end:0,total:0,iv:null},actx=null;
function beep(){try{if(!actx)return;const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=880;g.gain.value=.15;o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+.35)}catch(e){}try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}
function startTimer(sec){tm.total=sec;tm.end=Date.now()+sec*1000;clearInterval(tm.iv);tm.iv=setInterval(tickTimer,500);tickTimer()}
function tickTimer(){const el=$('#timer');const left=Math.max(0,Math.ceil((tm.end-Date.now())/1000));if(!tm.end){el.hidden=true;return}
 el.hidden=false;el.innerHTML='<div class="in"><div><div class="small" style="opacity:.75">Recupero</div><div class="t">'+Math.floor(left/60)+':'+String(left%60).padStart(2,'0')+'</div></div><div class="bar"><i style="width:'+(100*left/tm.total).toFixed(1)+'%"></i></div><button data-a="t15">+15 s</button><button data-a="tskip">'+(left?'Salta':'Chiudi')+'</button></div>';
 if(left===0&&tm.iv){clearInterval(tm.iv);tm.iv=null;beep()}}
function stopTimer(){clearInterval(tm.iv);tm.iv=null;tm.end=0;$('#timer').hidden=true}

/* ============ AZIONI ============ */
let wake=null;
async function keepAwake(){try{if(navigator.wakeLock)wake=await navigator.wakeLock.request('screen')}catch(e){}}
const A={
 tab:t=>{ui.tab=t.dataset.v;ui.confirm=null;render();window.scrollTo(0,0)},
 accept:()=>{state.profile.accettato=true;save();render()},
 start:t=>{const k=t.dataset.v,c=cycle(),p=dayPlan(k,c.month,c.week);
  state.draft={dayKey:k,dayName:p.nome,tipo:p.tipo,date:iso(),month:c.month,week:c.week,deload:c.week===4,warm:{},ex:p.ex.map(x=>({id:x.id,role:x.role,rx:x.rx,sug:suggest(x.id,x.rx,c.month),flag:null,sets:Array.from({length:x.rx.s},()=>({kg:'',reps:'',done:false}))}))};
  ui.open={};ui.warmOpen=true;saveDraft();keepAwake();render();window.scrollTo(0,0)},
 how:t=>{ui.open[t.dataset.v]=!ui.open[t.dataset.v];render()},
 done:t=>{const x=state.draft.ex[+t.dataset.i],st=x.sets[+t.dataset.j];st.done=!st.done;
  if(st.done){if(st.kg===''&&x.sug&&x.sug.kg!=null&&!E[x.id].bw)st.kg=String(x.sug.kg);if(st.reps===''&&x.rx.r)st.reps=String(x.rx.r[1]);startTimer(x.rx.rest)}
  saveDraft();render()},
 addset:t=>{const x=state.draft.ex[+t.dataset.i];const l=x.sets[x.sets.length-1]||{};x.sets.push({kg:l.kg||'',reps:'',done:false});saveDraft();render()},
 replace:t=>{const i=+t.dataset.i,id=t.dataset.v;const x=state.draft.ex[i];if(!E[id])return;x.id=id;x.flag=null;x.sug=suggest(id,x.rx,state.draft.month);x.sets=x.sets.map(()=>({kg:'',reps:'',done:false}));saveDraft();render();toast('Esercizio cambiato: '+E[id].n)},
 flag:t=>{const x=state.draft.ex[+t.dataset.i],tipo=t.dataset.v;x.flag=tipo;state.flags.push({ex:x.id,tipo,d:iso()});if(!state.swaps[x.id]&&E[x.id].alt)state.swaps[x.id]=E[x.id].alt;save();saveDraft();render()},
 finishOpen:()=>{ui.finish={rpe:7,inguine:state.draft.ex.some(x=>x.flag==='inguine'),schiena:state.draft.ex.some(x=>x.flag==='schiena'),cervicale:state.draft.ex.some(x=>x.flag==='cervicale'),note:''};renderSheet()},
 finishCancel:()=>{ui.finish=null;renderSheet()},
 rpe:t=>{ui.finish.rpe=+t.dataset.v;renderSheet()},
 finishSave:()=>{const d=state.draft,f=ui.finish;
  const s={id:'s'+Date.now(),ts:Date.now(),date:d.date,month:d.month,week:d.week,deload:d.deload,dayKey:d.dayKey,dayName:d.dayName,rpe:f.rpe,inguine:!!f.inguine,schiena:!!f.schiena,cervicale:!!f.cervicale,note:(f.note||'').slice(0,500),
   exercises:d.ex.map(x=>({id:x.id,lo:x.rx.r?x.rx.r[0]:null,hi:x.rx.r?x.rx.r[1]:null,flag:x.flag,sets:x.sets.filter(st=>st.done||st.reps!=='').map(st=>({kg:parseFloat(String(st.kg).replace(',','.'))||0,reps:parseInt(st.reps,10)||0}))})).filter(x=>x.sets.length)};
  state.sessions.push(s);state.draft=null;ui.finish=null;stopTimer();save();cloudSession(s);try{wake&&wake.release()}catch(e){}render();window.scrollTo(0,0);toast('Allenamento salvato')},
 askDiscard:()=>{ui.confirm='discard';render()},
 discard:()=>{state.draft=null;ui.confirm=null;stopTimer();saveDraft();render()},
 cancelConfirm:()=>{ui.confirm=null;render()},
 t15:()=>{tm.end+=15000;tm.total+=15;if(!tm.iv)tm.iv=setInterval(tickTimer,500);tickTimer()},
 tskip:()=>stopTimer(),
 planNext:()=>{ui.planNext=!ui.planNext;render()},
 bwAdd:()=>{const v=parseFloat(($('#bwIn').value||'').replace(',','.'));if(!(v>30&&v<250)){toast('Scrivi il peso in kg, per esempio 70,5');return}const d=iso();state.bw=state.bw.filter(b=>b.d!==d);state.bw.push({d,kg:v});state.bw.sort((a,b)=>a.d<b.d?-1:1);state.profile.peso=v;save();render();toast('Peso salvato')},
 askDel:t=>{ui.confirm='del'+t.dataset.v;render()},
 delSession:t=>{const id=t.dataset.v;state.sessions=state.sessions.filter(s=>s.id!==id);ui.confirm=null;save();cloudDel(id);render()},
 giorni:t=>{state.profile.giorni=+t.dataset.v;save();render()},
 unswap:t=>{delete state.swaps[t.dataset.v];save();render()},
 askReset:()=>{ui.confirm='reset';render()},
 resetCycle:()=>{state.profile.inizio=iso();ui.confirm=null;save();render();toast('Programma ripartito dal mese 1')},
 copyExport:()=>{const txt=JSON.stringify({v:1,profile:state.profile,swaps:state.swaps,flags:state.flags,bw:state.bw,sessions:state.sessions});
  const ta=$('#impTxt');const fallback=()=>{ta.value=txt;ta.select();toast('Testo selezionato: copialo con Copia')};
  try{navigator.clipboard.writeText(txt).then(()=>toast('Backup copiato'),fallback)}catch(e){fallback()}},
 importData:()=>{try{const o=JSON.parse($('#impTxt').value);if(!o||o.v!==1||!Array.isArray(o.sessions))throw 0;
  state.profile=Object.assign(fresh().profile,o.profile||{});state.swaps=o.swaps||{};state.flags=o.flags||[];state.bw=o.bw||[];
  const have=new Set(state.sessions.map(s=>s.id));o.sessions.forEach(s=>{if(!have.has(s.id)){state.sessions.push(s);cloudSession(s)}});state.sessions.sort((a,b)=>(a.ts||0)-(b.ts||0));
  save();render();toast('Backup importato')}catch(e){toast('Il testo incollato non è un backup valido di Scheda Viva')}}
};
document.addEventListener('click',e=>{
 if(!actx){try{actx=new (window.AudioContext||window.webkitAudioContext)()}catch(err){}}
 const t=e.target.closest('[data-a]');if(!t)return;const f=A[t.dataset.a];if(f){e.preventDefault();f(t)}});
document.addEventListener('input',e=>{const t=e.target;
 if(t.dataset.f==='kg'||t.dataset.f==='reps'){const st=state.draft.ex[+t.dataset.i].sets[+t.dataset.j];st[t.dataset.f]=t.value;saveDraft()}
 else if(t.dataset.f==='q'){ui.q=t.value;const pos=t.selectionStart;render();const s=$('#search');s.focus();try{s.setSelectionRange(pos,pos)}catch(err){}}
 else if(t.dataset.ff==='note'&&ui.finish){ui.finish.note=t.value}});
document.addEventListener('change',e=>{const t=e.target;
 if(t.dataset.w!=null&&state.draft){state.draft.warm[t.dataset.w]=t.checked;saveDraft()}
 else if(t.dataset.ff&&ui.finish&&t.type==='checkbox'){ui.finish[t.dataset.ff]=t.checked}
 else if(t.dataset.f==='progEx'){ui.progEx=t.value;render()}
 else if(t.dataset.p){const k=t.dataset.p;let v=t.value;if(k!=='inizio'){v=parseFloat(String(v).replace(',','.'));if(!(v>0)){toast('Valore non valido');render();return}}else if(!v){render();return}state.profile[k]=v;save();render()}});
document.addEventListener('toggle',e=>{if(e.target.id==='warm')ui.warmOpen=e.target.open},true);

render();
initCloud();
</script>
